services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kdsh_postgres
    environment:
      POSTGRES_DB: kdsh
      POSTGRES_USER: kdsh
      POSTGRES_PASSWORD: kdsh_password
    ports:
      - "5433:5432"
    volumes:
      - kdsh_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kdsh -d kdsh" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kdsh_pgdata:
